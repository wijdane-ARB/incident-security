
server.port=${PORT:8080}

# Development defaults; Railway overrides these via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/incidents;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Do not expose the H2 administration console
spring.h2.console.enabled=false

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:300000}
